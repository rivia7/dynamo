#
# The API token check that the Ingress runs before every request: Traefik's
# ForwardAuth middleware asks token_auth.py, which reads the tokens from the
# Secret omlx-api-tokens, one key per token holder, made by hand. Without that
# Secret every request through the Ingress gets 401. Callers inside the
# cluster, such as the AIPerf Job, use the frontend Service and skip the check.
#
# The overlays deploy into dynamo-omlx, which the middleware's address and the
# Ingress annotation name; another namespace changes both.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: omlx-auth
spec:
  forwardAuth:
    address: http://omlx-auth.dynamo-omlx.svc.cluster.local:8080/check
---
apiVersion: v1
kind: Service
metadata:
  name: omlx-auth
spec:
  selector:
    app.kubernetes.io/name: omlx-auth
  ports:
  - name: http
    port: 8080
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omlx-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: omlx-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: omlx-auth
    spec:
      containers:
      - name: main
        # Any image with python3 works; this one is on the node already.
        image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.5.1
        command: ["python3", "/app/token_auth.py", "--tokens-dir", "/tokens"]
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        securityContext:
          # The image names its user (dynamo), which runAsNonRoot cannot check.
          runAsUser: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: code
          mountPath: /app
          readOnly: true
        - name: tokens
          mountPath: /tokens
          readOnly: true
      volumes:
      - name: code
        configMap:
          name: omlx-auth-code
      - name: tokens
        secret:
          secretName: omlx-api-tokens
          optional: true
