#
# The Dynamo frontend with KV-aware routing plus one oMLX proxy per Mac, on the
# NGC Dynamo images. Keep the image tag equal to the dynamo-platform chart.
#
# The proxies need, in the same namespace:
#   omlx-profile      ConfigMap  the model; an overlay generates it from profile.env
#   omlx-proxy-code   ConfigMap  the proxy package; the base generates it
#   omlx-mac-<n>      Secret     OMLX_BRIDGE_URL and OMLX_API_KEY of Mac <n>, made by hand
#
# A further Mac is a copy of mac-1 (deploy/components/mac-2), which relies on
# these positions: components[1] is mac-1, containers[0] is main, envFrom[0] is
# the Mac's Secret.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: omlx
spec:
  components:
  - name: Frontend
    type: frontend
    replicas: 1
    sharedMemorySize: "0"
    podTemplate:
      spec:
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.5.1
          env:
          - name: DYN_ROUTER_MODE
            value: kv
          # oMLX commits prefix blocks when a request finishes; predicted routing
          # covers requests that share a prefix with one still generating.
          - name: DYN_ROUTER_PREDICTED_TTL_SECS
            value: "600"
          # The Anthropic Messages API (/v1/messages) for Claude Code, experimental
          # in 1.5.1. Claude Code starts its system prompt with a billing header
          # that names its version and entrypoint; stripping it lets every client
          # share the Macs' cached prefix.
          - name: DYN_ENABLE_ANTHROPIC_API
            value: "true"
          - name: DYN_STRIP_ANTHROPIC_PREAMBLE
            value: "true"
          # An SSE comment frame after 15 s without data on every stream. 1.5.1
          # sends none by default, so a stream waits silently for its first token,
          # and proxies such as Cloudflare close a response after 100 s without
          # data: a long prefill or a full Mac would cut the stream.
          - name: DYN_HTTP_SSE_KEEP_ALIVE_INTERVAL_MS
            value: "15000"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
  - name: mac-1
    type: worker
    replicas: 1
    sharedMemorySize: "0"
    podTemplate:
      spec:
        initContainers:
        - name: prepare
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.5.1
          # The image's entrypoint is /epp, so every container sets its command.
          command: ["/bin/sh", "/src/prepare.sh"]
          envFrom:
          - configMapRef:
              name: omlx-profile
          # HF_TOKEN lifts the Hub's limits on anonymous downloads.
          - secretRef:
              name: hf-token-secret
              optional: true
          volumeMounts:
          - name: proxy-code
            mountPath: /src
            readOnly: true
          - name: code
            mountPath: /opt/omlx
          - name: models
            mountPath: /models
        containers:
        - name: main
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.5.1
          command: ["python3", "-m", "dynamo_omlx.proxy"]
          # The model card's checksum covers the --model-path string and the files
          # there, so every proxy of a model uses the same path and the same files.
          args:
          - --model-path=/models/$(SERVED_MODEL_NAME)
          - --served-model-name=$(SERVED_MODEL_NAME)
          - --expect-block-size=$(EXPECT_BLOCK_SIZE)
          envFrom:
          # OMLX_BRIDGE_URL and OMLX_API_KEY; the proxy reads them itself, which
          # keeps the key off the command line.
          - secretRef:
              name: omlx-mac-1
          - configMapRef:
              name: omlx-profile
          env:
          - name: PYTHONPATH
            value: /opt/omlx
          # The runtime's canary gives the first token 3 s and otherwise marks the
          # worker not ready, which in 1.5.1 also fails liveness: /live and /health
          # share one handler. A long prefill on a Mac takes longer. Without the
          # canary the pod is ready once the proxy registered, and the proxy exits
          # by itself when its Mac stays unreachable.
          - name: DYN_HEALTH_CHECK_ENABLED
            value: "false"
          # No ports: they would replace the operator's named ports, which the
          # probes, Services and PodMonitors use.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
          - name: code
            mountPath: /opt/omlx
            readOnly: true
          - name: models
            mountPath: /models
            readOnly: true
        volumes:
        - name: proxy-code
          configMap:
            name: omlx-proxy-code
        - name: code
          emptyDir: {}
        - name: models
          emptyDir:
            sizeLimit: 256Mi
