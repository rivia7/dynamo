#
# The proxy of a second Mac: a copy of mac-1 that reads the Secret omlx-mac-2.
# An overlay adds it under components. For a third Mac, copy this directory to
# mac-3, change 2 to 3 in its last two operations, and list it after mac-2.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
- target:
    kind: DynamoGraphDeployment
    name: omlx
  patch: |-
    - {op: test, path: /spec/components/1/name, value: mac-1}
    - {op: copy, from: /spec/components/1, path: /spec/components/-}
    - {op: replace, path: /spec/components/2/name, value: mac-2}
    - {op: replace, path: /spec/components/2/podTemplate/spec/containers/0/envFrom/0/secretRef/name, value: omlx-mac-2}
