stages:
  label:
    e2e: "E2E（完整部署）"
    prefill: "P-Only（只测 prefill）"
    decode: "D-Only（只测 decode）"
  platform:
    generic: "通用 SSH 机器"
    lium: "lium.io 租用集群"
  banner:
    prefill: "测量阶段：P-Only，只测 PD 分离里的 prefill 阶段。每个 worker 用 PD 配置里 prefill 角色的参数（并行方式、chunked prefill、MTP 等），但按聚合模式运行、不传 KV；每个请求只生成 1 个 token（max_completion_tokens=1），所以本报告的吞吐都是输入 tok/s/GPU（每 GPU 每秒处理的 prompt token），前缀缓存命中照常生效。结果是整个集群都做 prefill 时能达到的上限；和同一数据集的 D-Only 结果一起，可以算出 PD 的最佳 GPU 配比（见知识库 INDEX.md）。"
    decode: "测量阶段：D-Only，只测 PD 分离里的 decode 阶段。每个 worker 用 PD 配置里 decode 角色的参数，KV 传输换成 SGLang 的 fake 后端：worker 照常为整段 prompt 分配 KV 再解码，但不等 prefill，也不做 prefill 计算。KV 内容没有意义，所以生成的文字没有意义，但 batch 大小、KV 占用和 attention 计算量和真实 decode 一样。本报告的吞吐是输出 tok/s/GPU；MTP 接受长度用模拟值，精度检查不适用。"
  replace:
    prefill:
      - ["输出 tok/s/GPU", "输入 tok/s/GPU"]
      - ["百万输出 token", "百万输入 token"]
      - ["每个输出 token", "每个输入 token"]
  overrides:
    prefill:
      method.objective: "目标：错误率 < 1% 的前提下，让饱和时的输入 tok/s/GPU 最高。P-Only 每个请求只生成 1 个 token，没有单用户速度门槛；TTFT 仍然记录，用来看排队有多长。并发取 2 的幂，其他并发值只用来细化拐点。"
      summary.best: "最优配置：{family}（{key}），并发 {c} 时达到 {tps}；TTFT p50 {ttft} ms。"
    decode:
      method.objective: "目标：错误率 < 1% 的前提下，让饱和时的输出 tok/s/GPU 最高（所有 GPU 都只做 decode）；另外从并发曲线读出单用户 ≥ 20 和 ≥ 50 tok/s 时的吞吐。并发取 2 的幂，其他并发值只用来细化拐点。"
