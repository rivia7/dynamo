  agentx: "负载：AIPerf {aiperf} 的 AgentX 闭环回放（--scenario agentx），重放公开的 Claude Code trace 语料 {dataset}。并发数就是同时进行的会话（lane）数；每个会话等上一轮回复完成后才发下一轮请求，输出带 ignore_eos；--max-context-length 设为服务支持的上下文长度 {ctx} tokens。"
