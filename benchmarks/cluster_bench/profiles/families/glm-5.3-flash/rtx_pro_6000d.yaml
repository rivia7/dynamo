#
# GLM-5.3-Flash (NVFP4, ~0.2 TB) on RTX PRO 6000D Blackwell Server (89.8 GB,
# SM120, PCIe only), written for 4 nodes x 8 like the GLM-5.3 file (scales to
# 2/8 nodes; ids/titles are templates). Facts below were measured with
# sglang-runtime:1.6.2 (SGLang 0.5.21) on 2 x 8 GPUs, 2026-11-23.
#
# TP4 holds the weights (about 48 GiB per GPU), so roles are TP4, plus a TP8
# decode variant. The recipes' backends do not run on SM120: the trtllm-gen
# DSA and MoE kernels are SM100-only ("TllmGenFmhaRunner: Unsupported
# architecture"), so MoE and FP4 GEMMs use CUTLASS and the KDA layers Triton
# (ptx_kda needs SM103 and would fall back to Triton anyway).
#
# DSA attention: this model's indexer pools keys (index_kpool 4), which SGLang
# 0.5.21 serves only with the FA3, TRTLLM or TileLang DSA kernels;
# flashinfer_sparse_mla, GLM-5.3's FP8 path on SM120, accepts only GLM-5.3. On
# SM120 that leaves TileLang, which needs a BF16 KV cache and the hotfix
# sm120-tilelang-dsa-v1-one-stage (agents/sglang_hotfix.py: its kernel asked
# for 148 KiB of shared memory, SM120 allows 99 KiB). Every role names it in
# CB_SGLANG_HOTFIXES. With it, TP4 and TP8 aggregated servers answered
# correctly (a 60k-token needle test included).
#
# One decode instance at mem-fraction-static 0.88 holds 1,569,216 tokens at
# TP4 (BF16, MTP on): only the 11 MLA layers keep KV, and in decode mode the
# KDA state cache holds just max-running-requests slots. A TP8 server at 0.88
# ran out of memory in a 16k-token prefill chunk (MoE workspace), so roles
# that prefill use 0.85; decode never prefills. Only the agg (as a plain
# SGLang server) and decode (fake KV transfer) settings ran here; the prefill
# role follows the recipe with the same backends and is untested.
gpu: rtx_pro_6000d
model: glm-5.3-flash
# GLM-5.3's value on this GPU (its KV pool's limit), so both models replay the
# same 198 of the 393 AgentX traces and their runs compare directly. The pool
# here allows the model's 1M context: 1048576 keeps all 393 traces (the
# longest peaks at 996,579 tokens).
served_context: 229376
# Lanes for 4 nodes (halved on 2); D-Only doubles them (every GPU decodes), so
# on 2 nodes its climb runs 32..256. GLM-5.3's 8..128 is KV-bound at its start,
# but this model keeps about 6x more KV tokens per GPU: rtx6000d-flash-donly-001
# with 8..128 still gained 18% at its last step (TP4x4, c=128). Below 32 lanes
# AgentX's think time leaves 2-3 requests in flight, so a doubling there is
# within the noise and ended its TP8x2 climb at c=16.
default_grid: {start: 32, max: 256, min: 2}

families:
  - id: agg-tp4
    title: "聚合 TP4 x{agg}"
    priority: 0
    roles:
      - role: agg
        gpus_per_instance: 4
        instances: 8
        sglang:
          tensor-parallel-size: 4
          kv-cache-dtype: bfloat16
          dsa-prefill-backend: tilelang
          dsa-decode-backend: tilelang
          moe-runner-backend: flashinfer_cutlass
          fp4-gemm-backend: flashinfer_cutlass
          linear-attn-prefill-backend: triton
          linear-attn-decode-backend: triton
          linear-attn-verify-backend: triton
          mamba-ssm-dtype: float32
          page-size: 64
          chunked-prefill-size: 16384
          max-prefill-tokens: 16384
          max-running-requests: 64
          watchdog-timeout: 3600
          weight-loader-prefetch-checkpoints: true
          model-loader-extra-config: {enable_multithread_load: true, num_threads: 32}
          speculative-algorithm: EAGLE
          speculative-num-steps: 3
          speculative-eagle-topk: 1
          speculative-num-draft-tokens: 4
          enable-linear-replayssm-spec: true
          mem-fraction-static: 0.85
          cuda-graph-max-bs-decode: 64
        env: {CB_SGLANG_HOTFIXES: sm120-tilelang-dsa-v1-one-stage}
    notes: >-
      Recipe agg settings with SM120 backends: CUTLASS MoE/FP4, Triton KDA,
      TileLang DSA with a BF16 KV cache (hotfix sm120-tilelang-dsa-v1-one-stage).

  - id: pd-{prefill}p{decode}d
    title: "PD 分离 {prefill}P(TP4) + {decode}D(TP4)"
    priority: 10
    transport: mooncake
    cross_node: [kv]
    roles:
      - role: prefill
        gpus_per_instance: 4
        instances: 4
        sglang:
          tensor-parallel-size: 4
          kv-cache-dtype: bfloat16
          dsa-prefill-backend: tilelang
          dsa-decode-backend: tilelang
          moe-runner-backend: flashinfer_cutlass
          fp4-gemm-backend: flashinfer_cutlass
          linear-attn-prefill-backend: triton
          linear-attn-decode-backend: triton
          linear-attn-verify-backend: triton
          mamba-ssm-dtype: float32
          page-size: 64
          chunked-prefill-size: 16384
          max-prefill-tokens: 16384
          max-running-requests: 64
          watchdog-timeout: 3600
          weight-loader-prefetch-checkpoints: true
          model-loader-extra-config: {enable_multithread_load: true, num_threads: 32}
          disaggregation-mode: prefill
          disaggregation-transfer-backend: mooncake
          mem-fraction-static: 0.85
          mamba-full-memory-ratio: 0.5
          cuda-graph-backend-decode: disabled
        extra_args: [--cuda-graph-backend-prefill, disabled]
        env: {MC_FORCE_HCA: "1", CB_SGLANG_HOTFIXES: sm120-tilelang-dsa-v1-one-stage}
      - role: decode
        gpus_per_instance: 4
        instances: 4
        sglang:
          tensor-parallel-size: 4
          kv-cache-dtype: bfloat16
          dsa-prefill-backend: tilelang
          dsa-decode-backend: tilelang
          moe-runner-backend: flashinfer_cutlass
          fp4-gemm-backend: flashinfer_cutlass
          linear-attn-prefill-backend: triton
          linear-attn-decode-backend: triton
          linear-attn-verify-backend: triton
          mamba-ssm-dtype: float32
          page-size: 64
          chunked-prefill-size: 16384
          max-prefill-tokens: 16384
          max-running-requests: 64
          watchdog-timeout: 3600
          weight-loader-prefetch-checkpoints: true
          model-loader-extra-config: {enable_multithread_load: true, num_threads: 32}
          speculative-algorithm: EAGLE
          speculative-num-steps: 3
          speculative-eagle-topk: 1
          speculative-num-draft-tokens: 4
          enable-linear-replayssm-spec: true
          disaggregation-mode: decode
          disaggregation-transfer-backend: mooncake
          mem-fraction-static: 0.88
          cuda-graph-max-bs-decode: 64
        env: {MC_FORCE_HCA: "1", SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "3600", CB_SGLANG_HOTFIXES: sm120-tilelang-dsa-v1-one-stage}
    notes: Recipe disagg settings with the SM120 backends; decode as the recipe (TP4).

  - id: pd-{prefill}p{decode}d-tp8d
    title: "PD 分离 {prefill}P(TP4) + {decode}D(TP8)"
    priority: 20
    transport: mooncake
    cross_node: [kv]
    roles:
      - role: prefill
        gpus_per_instance: 4
        instances: 4
        sglang:
          tensor-parallel-size: 4
          kv-cache-dtype: bfloat16
          dsa-prefill-backend: tilelang
          dsa-decode-backend: tilelang
          moe-runner-backend: flashinfer_cutlass
          fp4-gemm-backend: flashinfer_cutlass
          linear-attn-prefill-backend: triton
          linear-attn-decode-backend: triton
          linear-attn-verify-backend: triton
          mamba-ssm-dtype: float32
          page-size: 64
          chunked-prefill-size: 16384
          max-prefill-tokens: 16384
          max-running-requests: 64
          watchdog-timeout: 3600
          weight-loader-prefetch-checkpoints: true
          model-loader-extra-config: {enable_multithread_load: true, num_threads: 32}
          disaggregation-mode: prefill
          disaggregation-transfer-backend: mooncake
          mem-fraction-static: 0.85
          mamba-full-memory-ratio: 0.5
          cuda-graph-backend-decode: disabled
        extra_args: [--cuda-graph-backend-prefill, disabled]
        env: {MC_FORCE_HCA: "1", CB_SGLANG_HOTFIXES: sm120-tilelang-dsa-v1-one-stage}
      - role: decode
        gpus_per_instance: 8
        instances: 2
        sglang:
          tensor-parallel-size: 8
          kv-cache-dtype: bfloat16
          dsa-prefill-backend: tilelang
          dsa-decode-backend: tilelang
          moe-runner-backend: flashinfer_cutlass
          fp4-gemm-backend: flashinfer_cutlass
          linear-attn-prefill-backend: triton
          linear-attn-decode-backend: triton
          linear-attn-verify-backend: triton
          mamba-ssm-dtype: float32
          page-size: 64
          chunked-prefill-size: 16384
          max-prefill-tokens: 16384
          max-running-requests: 64
          watchdog-timeout: 3600
          weight-loader-prefetch-checkpoints: true
          model-loader-extra-config: {enable_multithread_load: true, num_threads: 32}
          speculative-algorithm: EAGLE
          speculative-num-steps: 3
          speculative-eagle-topk: 1
          speculative-num-draft-tokens: 4
          enable-linear-replayssm-spec: true
          disaggregation-mode: decode
          disaggregation-transfer-backend: mooncake
          mem-fraction-static: 0.88
          cuda-graph-max-bs-decode: 64
        env: {MC_FORCE_HCA: "1", SGLANG_DISAGGREGATION_WAITING_TIMEOUT: "3600", CB_SGLANG_HOTFIXES: sm120-tilelang-dsa-v1-one-stage}
    notes: >-
      TP8 decode: half the weights per GPU, so twice the KV per instance, for
      twice the GPUs per instance and all-reduces over PCIe.

ladder:
  - id: sm120-no-spec
    when: kernel_unsupported
    sglang:
      speculative-algorithm: null
      speculative-num-steps: null
      speculative-eagle-topk: null
      speculative-num-draft-tokens: null
      enable-linear-replayssm-spec: null
  - id: oom-mem-0.03
    when: oom
    mem_fraction_delta: -0.03
    halve_cuda_graph_bs: true
